# Local development stack (editorial; not run end-to-end in this repository's audit).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sqs
    ports:
      - "4566:4566"

  init-queue:
    image: amazon/aws-cli:2
    depends_on: [localstack]
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: ap-south-1
    entrypoint: ["sh", "-c", "until aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name orders; do sleep 2; done"]

  api:
    build: .
    env_file: .env.example
    ports:
      - "3000:3000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      init-queue: { condition: service_completed_successfully }

  worker:
    build: .
    command: ["node", "dist/worker.js"]
    env_file: .env.example
    depends_on:
      postgres: { condition: service_healthy }
      init-queue: { condition: service_completed_successfully }

volumes:
  pgdata: {}
