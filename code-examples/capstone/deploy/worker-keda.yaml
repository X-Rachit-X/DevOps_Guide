# Worker scaled by queue depth with KEDA (requires KEDA installed; the source text only says "scale on queue depth"). Editorial.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      terminationGracePeriodSeconds: 70   # longer than the 20s long poll plus in-flight work
      containers:
        - name: worker
          image: <account-id>.dkr.ecr.ap-south-1.amazonaws.com/order-platform:<git-sha>
          command: ["node", "dist/worker.js"]
          envFrom:
            - secretRef:
                name: api-secrets
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker
spec:
  scaleTargetRef:
    name: worker
  minReplicaCount: 1
  maxReplicaCount: 20
  triggers:
    - type: aws-sqs-queue
      metadata:
        queueURL: https://sqs.ap-south-1.amazonaws.com/<account-id>/orders   # placeholder
        queueLength: "10"
        awsRegion: ap-south-1
      # authenticationRef / pod identity omitted - configure per Chapter 31
